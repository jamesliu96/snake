<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake AI Simulator</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .grid-bg {
      background-size: 20px 20px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>

<body class="h-full flex flex-col font-mono antialiased select-none overflow-x-hidden md:overflow-hidden">

  <header
    class="border-b border-slate-800 bg-slate-900/50 px-4 md:px-6 py-2.5 md:py-3 flex items-center justify-between backdrop-blur-sm shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-sm md:text-base font-semibold tracking-wide text-slate-200">SNAKE AI <span
          class="hidden sm:inline text-xs text-slate-500 font-normal">v2.0 (Hamiltonian Core)</span></h1>
    </div>
    <div class="flex items-center gap-3 sm:gap-6 text-xs text-slate-400">
      <div>GRID: <span id="grid-dim-val" class="text-slate-200">32×18</span></div>
      <div>STATUS: <span id="status-tag" class="text-amber-400">READY</span></div>
    </div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">

    <div class="w-full lg:flex-1 bg-slate-950 flex flex-col items-center justify-center p-2 sm:p-4 grid-bg shrink-0">
      <div
        class="relative w-full max-w-[960px] aspect-[16/9] border border-slate-800 rounded-lg shadow-2xl overflow-hidden bg-slate-900/80">
        <canvas id="gameCanvas" width="960" height="540" class="w-full h-full block"></canvas>

        <div id="loading-overlay"
          class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center gap-3 z-10 transition-opacity duration-300">
          <div
            class="w-7 h-7 md:w-8 md:h-8 border-2 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin">
          </div>
          <div class="text-xs text-slate-400 font-mono" id="loading-text">Simulating Full Game...</div>
        </div>
      </div>
    </div>

    <aside
      class="w-full lg:w-80 border-t lg:border-t-0 lg:border-l border-slate-800 bg-slate-900/30 p-4 md:p-5 flex flex-col gap-4 md:gap-6 backdrop-blur-md shrink-0 lg:overflow-y-auto">

      <section class="space-y-2">
        <div class="text-[10px] md:text-xs font-semibold text-slate-400 tracking-wider">TELEMETRY</div>
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-800/40 border border-slate-800 p-2 md:p-2.5 rounded">
            <div class="text-slate-500 text-[10px] md:text-xs">LENGTH</div>
            <div class="text-base md:text-lg font-bold text-slate-100" id="m-len">0 / 576</div>
          </div>
          <div class="bg-slate-800/40 border border-slate-800 p-2.5 rounded">
            <div class="text-slate-500 text-[10px] md:text-xs">COVERAGE</div>
            <div class="text-base md:text-lg font-bold text-emerald-400" id="m-prog">0.0%</div>
          </div>
          <div class="bg-slate-800/40 border border-slate-800 p-2.5 rounded">
            <div class="text-slate-500 text-[10px] md:text-xs">MODE</div>
            <div class="text-xs md:text-sm font-bold text-cyan-400 mt-0.5 md:mt-1" id="m-mode">-</div>
          </div>
          <div class="bg-slate-800/40 border border-slate-800 p-2.5 rounded">
            <div class="text-slate-500 text-[10px] md:text-xs">TOTAL STEPS</div>
            <div class="text-xs md:text-sm font-bold text-slate-300 mt-0.5 md:mt-1" id="m-steps">0</div>
          </div>
        </div>
      </section>

      <section class="space-y-1.5">
        <div class="text-[10px] md:text-xs font-semibold text-slate-400 tracking-wider">STRATEGY BREAKDOWN</div>
        <div class="bg-slate-800/40 border border-slate-800 p-2.5 md:p-3 rounded space-y-2 text-xs">
          <div>
            <div class="flex justify-between text-slate-400 mb-1 text-[11px] md:text-xs">
              <span>SHORTCUT</span>
              <span id="p-shortcut">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div id="bar-shortcut" class="bg-cyan-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-slate-400 mb-1 text-[11px] md:text-xs">
              <span>HAMILTONIAN</span>
              <span id="p-hamiltonian">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div id="bar-hamiltonian" class="bg-slate-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="space-y-3.5 mt-auto pb-4 lg:pb-0">
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-slate-400">
            <span>TIMELINE FRAME</span>
            <span id="frame-counter">0 / 0</span>
          </div>
          <input type="range" id="timeline" min="0" max="0" value="0"
            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500 touch-pan-x">
        </div>

        <div class="grid grid-cols-4 gap-2">
          <button id="btn-prev"
            class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-200 py-2.5 rounded text-xs transition touch-manipulation">
            ⏮ -1
          </button>
          <button id="btn-play"
            class="col-span-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-slate-950 font-bold py-2.5 rounded text-xs transition touch-manipulation">
            PLAY
          </button>
          <button id="btn-next"
            class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 text-slate-200 py-2.5 rounded text-xs transition touch-manipulation">
            +1 ⏭
          </button>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500">SPEED:</span>
          <select id="speed-select"
            class="flex-1 bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded px-2 py-2 outline-none">
            <option value="1">1x (60 FPS)</option>
            <option value="2" selected>2x (120 FPS)</option>
            <option value="5">5x (300 FPS)</option>
            <option value="10">10x (Fast Forward)</option>
          </select>
        </div>

        <button id="btn-recalc"
          class="w-full border border-slate-700 hover:border-slate-500 text-slate-300 py-2.5 rounded text-xs transition bg-slate-800/30 touch-manipulation">
          RE-SIMULATE (NEW SEED)
        </button>
      </section>

    </aside>
  </main>

  <script>
    const GRID_W = 32;
    const GRID_H = 18;
    const TOTAL_CELLS = GRID_W * GRID_H;
    const CELL_SIZE = 30;

    class Point {
      constructor(x, y) { this.x = x; this.y = y; }
      add(q) { return new Point(this.x + q.x, this.y + q.y); }
      equals(q) { return q && this.x === q.x && this.y === q.y; }
      inBounds() { return this.x >= 0 && this.x < GRID_W && this.y >= 0 && this.y < GRID_H; }
    }

    const DIRS = [
      new Point(0, -1),
      new Point(0, 1),
      new Point(-1, 0),
      new Point(1, 0)
    ];

    class GameSimulator {
      constructor() {
        this.cycle = [];
        this.cycleIdx = new Array(TOTAL_CELLS);
        this.buildHamiltonianCycle();
      }

      buildHamiltonianCycle() {
        this.cycle = [];
        for (let x = 0; x < GRID_W; x++) this.cycle.push(new Point(x, 0));
        for (let y = 1; y < GRID_H - 1; y++) {
          if (y % 2 === 1) {
            for (let x = GRID_W - 1; x >= 1; x--) this.cycle.push(new Point(x, y));
          } else {
            for (let x = 1; x < GRID_W; x++) this.cycle.push(new Point(x, y));
          }
        }
        for (let x = GRID_W - 1; x >= 0; x--) this.cycle.push(new Point(x, GRID_H - 1));
        for (let y = GRID_H - 2; y >= 1; y--) this.cycle.push(new Point(0, y));

        for (let idx = 0; idx < this.cycle.length; idx++) {
          const pt = this.cycle[idx];
          this.cycleIdx[pt.y * GRID_W + pt.x] = idx;
        }
      }

      distanceOnCycle(fromIdx, toIdx) {
        return (toIdx - fromIdx + TOTAL_CELLS) % TOTAL_CELLS;
      }

      isIdxInSnakeBody(idx, tailIdx, headIdx) {
        const snakeStart = tailIdx;
        const snakeEnd = headIdx;
        if (snakeStart <= snakeEnd) {
          return idx >= snakeStart && idx <= snakeEnd;
        }
        return idx >= snakeStart || idx <= snakeEnd;
      }

      canReachTail(snake, food, activeCells, nextHead) {
        const isEating = nextHead.equals(food);
        const tail = snake[snake.length - 1];

        const visited = new Array(TOTAL_CELLS).fill(false);
        const queue = [nextHead];
        visited[nextHead.y * GRID_W + nextHead.x] = true;

        const nextHeadIdx = nextHead.y * GRID_W + nextHead.x;
        const tailIdx = tail.y * GRID_W + tail.x;

        const oldNextHeadActive = activeCells[nextHeadIdx];
        const oldTailActive = activeCells[tailIdx];

        activeCells[nextHeadIdx] = true;
        if (!isEating) activeCells[tailIdx] = false;

        let canReach = false;
        let headPtr = 0;

        while (headPtr < queue.length) {
          const curr = queue[headPtr++];
          if (curr.equals(tail)) {
            canReach = true;
            break;
          }

          for (const d of DIRS) {
            const nxt = curr.add(d);
            if (nxt.inBounds()) {
              const idx = nxt.y * GRID_W + nxt.x;
              if (!activeCells[idx] && !visited[idx]) {
                visited[idx] = true;
                queue.push(nxt);
              }
            }
          }
        }

        activeCells[nextHeadIdx] = oldNextHeadActive;
        activeCells[tailIdx] = oldTailActive;

        return canReach;
      }

      aiStep(snake, food, activeCells, dir) {
        const head = snake[0];
        const headIdx = this.cycleIdx[head.y * GRID_W + head.x];
        const foodIdx = this.cycleIdx[food.y * GRID_W + food.x];
        const tail = snake[snake.length - 1];
        const tailIdx = this.cycleIdx[tail.y * GRID_W + tail.x];
        const opposite = new Point(-dir.x, -dir.y);

        const snakeLen = snake.length;
        const nextOnCycle = this.cycle[(headIdx + 1) % TOTAL_CELLS];
        const defaultDir = new Point(nextOnCycle.x - head.x, nextOnCycle.y - head.y);

        let bestDir = defaultDir;
        let bestDist = this.distanceOnCycle(headIdx, foodIdx);
        let foundShortcut = false;

        for (const d of DIRS) {
          if (d.equals(opposite)) continue;
          const next = head.add(d);
          if (!next.inBounds() || activeCells[next.y * GRID_W + next.x]) continue;

          const nextIdx = this.cycleIdx[next.y * GRID_W + next.x];
          if (this.isIdxInSnakeBody(nextIdx, tailIdx, headIdx)) continue;

          const dist = this.distanceOnCycle(nextIdx, foodIdx);

          if (dist < bestDist) {
            const cycleDistToTail = this.distanceOnCycle(nextIdx, tailIdx);
            if (cycleDistToTail > snakeLen && this.canReachTail(snake, food, activeCells, next)) {
              bestDist = dist;
              bestDir = d;
              foundShortcut = true;
            }
          }
        }

        if (!foundShortcut || bestDir.equals(defaultDir)) {
          return { dir: defaultDir, mode: "HAMILTONIAN" };
        }
        return { dir: bestDir, mode: "SHORTCUT" };
      }

      runSimulation() {
        const history = [];
        const activeCells = new Array(TOTAL_CELLS).fill(false);

        const startIdx = Math.floor(this.cycle.length / 2);
        const snake = [];
        for (let i = 0; i < 3; i++) {
          const idx = (startIdx - i + this.cycle.length) % this.cycle.length;
          const pt = this.cycle[idx];
          snake.push(pt);
          activeCells[pt.y * GRID_W + pt.x] = true;
        }

        const nextP = this.cycle[(startIdx + 1) % this.cycle.length];
        let dir = new Point(nextP.x - snake[0].x, nextP.y - snake[0].y);

        const spawnFood = () => {
          const free = [];
          for (let y = 0; y < GRID_H; y++) {
            for (let x = 0; x < GRID_W; x++) {
              if (!activeCells[y * GRID_W + x]) free.push(new Point(x, y));
            }
          }
          if (free.length === 0) return null;
          return free[Math.floor(Math.random() * free.length)];
        };

        let food = spawnFood();
        let alive = true;

        while (alive && snake.length < TOTAL_CELLS) {
          const decision = this.aiStep(snake, food, activeCells, dir);
          dir = decision.dir;

          history.push({
            snake: snake.map(p => new Point(p.x, p.y)),
            food: new Point(food.x, food.y),
            mode: decision.mode,
            dir: new Point(dir.x, dir.y)
          });

          const newHead = snake[0].add(dir);
          const eat = newHead.equals(food);

          snake.unshift(newHead);
          activeCells[newHead.y * GRID_W + newHead.x] = true;

          if (!eat) {
            const tail = snake.pop();
            activeCells[tail.y * GRID_W + tail.x] = false;
          } else {
            food = spawnFood();
            if (!food) break;
          }
        }

        if (snake.length === TOTAL_CELLS) {
          history.push({
            snake: snake.map(p => new Point(p.x, p.y)),
            food: food ? new Point(food.x, food.y) : new Point(-1, -1),
            mode: "FINISHED",
            dir: new Point(0, 0)
          });
        }

        return history;
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const simulator = new GameSimulator();
    let history = [];
    let currentFrame = 0;
    let isPlaying = false;
    let playInterval = null;

    const elTimeline = document.getElementById('timeline');
    const elFrameCounter = document.getElementById('frame-counter');
    const elMLen = document.getElementById('m-len');
    const elMProg = document.getElementById('m-prog');
    const elMMode = document.getElementById('m-mode');
    const elMSteps = document.getElementById('m-steps');
    const elPShortcut = document.getElementById('p-shortcut');
    const elPHamiltonian = document.getElementById('p-hamiltonian');
    const elBarShortcut = document.getElementById('bar-shortcut');
    const elBarHamiltonian = document.getElementById('bar-hamiltonian');
    const elBtnPlay = document.getElementById('btn-play');
    const elLoading = document.getElementById('loading-overlay');
    const elStatusTag = document.getElementById('status-tag');

    function startSimulation() {
      isPlaying = false;
      clearInterval(playInterval);
      elLoading.classList.remove('opacity-0', 'pointer-events-none');
      elStatusTag.textContent = "CALCULATING";
      elStatusTag.className = "text-amber-400";

      setTimeout(() => {
        history = simulator.runSimulation();

        let shortcuts = 0, hams = 0;
        history.forEach(f => {
          if (f.mode === "SHORTCUT") shortcuts++;
          if (f.mode === "HAMILTONIAN") hams++;
        });
        const total = shortcuts + hams || 1;
        const pShort = (shortcuts / total * 100).toFixed(1);
        const pHam = (hams / total * 100).toFixed(1);

        elPShortcut.textContent = `${pShort}%`;
        elPHamiltonian.textContent = `${pHam}%`;
        elBarShortcut.style.width = `${pShort}%`;
        elBarHamiltonian.style.width = `${pHam}%`;

        elTimeline.max = history.length - 1;
        elTimeline.value = 0;
        currentFrame = 0;

        elLoading.classList.add('opacity-0', 'pointer-events-none');
        elStatusTag.textContent = "READY";
        elStatusTag.className = "text-emerald-400";

        renderFrame(0);
      }, 50);
    }

    function renderFrame(idx) {
      if (!history || history.length === 0) return;
      const frame = history[idx];

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let x = 0; x <= GRID_W; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL_SIZE, 0);
        ctx.lineTo(x * CELL_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= GRID_H; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL_SIZE);
        ctx.lineTo(canvas.width, y * CELL_SIZE);
        ctx.stroke();
      }

      if (frame.food.x >= 0) {
        const fx = frame.food.x * CELL_SIZE + CELL_SIZE / 2;
        const fy = frame.food.y * CELL_SIZE + CELL_SIZE / 2;
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fb7185';
        ctx.beginPath();
        ctx.arc(fx, fy, CELL_SIZE / 2 - 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      const len = frame.snake.length;
      frame.snake.forEach((pt, i) => {
        const px = pt.x * CELL_SIZE + 2;
        const py = pt.y * CELL_SIZE + 2;
        const size = CELL_SIZE - 4;

        if (i === 0) {
          ctx.fillStyle = '#f8fafc';
        } else {
          const alpha = 1 - (i / len) * 0.6;
          ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
        }

        ctx.fillRect(px, py, size, size);
      });

      elFrameCounter.textContent = `${idx} / ${history.length - 1}`;
      elMLen.textContent = `${len} / ${TOTAL_CELLS}`;
      elMProg.textContent = `${(len / TOTAL_CELLS * 100).toFixed(1)}%`;
      elMMode.textContent = frame.mode;
      elMSteps.textContent = idx;
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      elBtnPlay.textContent = isPlaying ? "PAUSE" : "PLAY";
      elBtnPlay.className = isPlaying
        ? "col-span-2 bg-amber-500 hover:bg-amber-400 font-bold py-2.5 rounded text-xs transition text-slate-950 touch-manipulation"
        : "col-span-2 bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded text-xs transition text-slate-950 touch-manipulation";

      if (isPlaying) {
        const speed = parseInt(document.getElementById('speed-select').value);
        const intervalMs = Math.max(1000 / (60 * speed), 4);
        playInterval = setInterval(() => {
          if (currentFrame < history.length - 1) {
            currentFrame++;
            elTimeline.value = currentFrame;
            renderFrame(currentFrame);
          } else {
            togglePlay();
          }
        }, intervalMs);
      } else {
        clearInterval(playInterval);
      }
    }

    elTimeline.addEventListener('input', (e) => {
      currentFrame = parseInt(e.target.value);
      renderFrame(currentFrame);
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (currentFrame > 0) {
        currentFrame--;
        elTimeline.value = currentFrame;
        renderFrame(currentFrame);
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (currentFrame < history.length - 1) {
        currentFrame++;
        elTimeline.value = currentFrame;
        renderFrame(currentFrame);
      }
    });

    elBtnPlay.addEventListener('click', togglePlay);
    document.getElementById('btn-recalc').addEventListener('click', startSimulation);
    document.getElementById('speed-select').addEventListener('change', () => {
      if (isPlaying) { togglePlay(); togglePlay(); }
    });

    startSimulation();
  </script>
</body>

</html>
