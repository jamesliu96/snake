<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake AI Simulator</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .grid-bg {
      background-size: 20px 20px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    input[type=range]::-webkit-slider-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      -webkit-appearance: none;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
  </style>
</head>

<body class="h-full flex flex-col font-mono antialiased select-none overflow-x-hidden md:overflow-hidden">

  <header
    class="border-b border-slate-800/80 bg-slate-900/60 px-4 md:px-6 py-2.5 md:py-3 flex items-center justify-between backdrop-blur-md shrink-0 z-20">
    <div class="flex items-center gap-2.5">
      <div id="status-indicator"
        class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse transition-colors duration-300"></div>
      <h1 class="text-sm md:text-base font-semibold tracking-wider text-slate-200">SNAKE AI <span
          class="text-xs text-slate-500 font-normal">SIMULATOR</span></h1>
    </div>
    <div class="flex items-center gap-4 sm:gap-6 text-xs text-slate-400">
      <div>ENGINE: <span id="engine-tag" class="text-emerald-400 font-semibold">INITIALIZING...</span></div>
      <div>GRID: <span id="grid-dim-val" class="text-slate-200 font-semibold">32×18</span></div>
      <div>STATUS: <span id="status-tag" class="text-emerald-400 font-semibold tracking-wide">READY</span></div>
    </div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">

    <div class="w-full lg:flex-1 bg-slate-950 flex flex-col items-center justify-center p-2 sm:p-4 grid-bg shrink-0">
      <div
        class="relative w-full max-w-[960px] aspect-[16/9] border border-slate-800/80 rounded-xl shadow-2xl overflow-hidden bg-slate-900/90 ring-1 ring-white/5">
        <canvas id="gameCanvas" width="960" height="540" class="w-full h-full block"></canvas>

        <div id="loading-overlay"
          class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center gap-3 z-30 transition-opacity duration-200">
          <div class="w-8 h-8 border-2 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin">
          </div>
          <div class="text-xs text-slate-300 font-mono tracking-wider" id="loading-text">SIMULATING PATH...</div>
        </div>
      </div>
    </div>

    <aside
      class="w-full lg:w-80 border-t lg:border-t-0 lg:border-l border-slate-800/80 bg-slate-900/40 p-4 md:p-5 flex flex-col gap-4 md:gap-5 backdrop-blur-md shrink-0 lg:overflow-y-auto">

      <section class="space-y-2">
        <div class="text-[10px] md:text-xs font-semibold text-slate-400 tracking-wider flex justify-between">
          <span>TELEMETRY</span>
          <span class="text-slate-600">LIVE</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-800/30 border border-slate-800/80 p-2.5 rounded-lg">
            <div class="text-slate-500 text-[10px]">LENGTH</div>
            <div class="text-base font-bold text-slate-100" id="m-len">0 / 576</div>
          </div>
          <div class="bg-slate-800/30 border border-slate-800/80 p-2.5 rounded-lg">
            <div class="text-slate-500 text-[10px]">COVERAGE</div>
            <div class="text-base font-bold text-emerald-400" id="m-prog">0.0%</div>
          </div>
          <div class="bg-slate-800/30 border border-slate-800/80 p-2.5 rounded-lg">
            <div class="text-slate-500 text-[10px]">MODE</div>
            <div class="text-xs font-bold text-cyan-400 mt-1" id="m-mode">-</div>
          </div>
          <div class="bg-slate-800/30 border border-slate-800/80 p-2.5 rounded-lg">
            <div class="text-slate-500 text-[10px]">STEPS</div>
            <div class="text-xs font-bold text-slate-300 mt-1" id="m-steps">0</div>
          </div>
        </div>
      </section>

      <section class="space-y-2">
        <div class="text-[10px] md:text-xs font-semibold text-slate-400 tracking-wider">STRATEGY BREAKDOWN</div>
        <div class="bg-slate-800/30 border border-slate-800/80 p-3 rounded-lg space-y-2.5 text-xs">
          <div>
            <div class="flex justify-between text-slate-400 mb-1 text-[11px]">
              <span>SHORTCUT</span>
              <span id="p-shortcut" class="text-cyan-400 font-semibold">0%</span>
            </div>
            <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
              <div id="bar-shortcut" class="bg-cyan-500 h-full transition-all duration-300 rounded-full"
                style="width: 0%"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-slate-400 mb-1 text-[11px]">
              <span>HAMILTONIAN</span>
              <span id="p-hamiltonian" class="text-slate-400 font-semibold">0%</span>
            </div>
            <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
              <div id="bar-hamiltonian" class="bg-slate-500 h-full transition-all duration-300 rounded-full"
                style="width: 0%"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="space-y-4 mt-auto pb-4 lg:pb-0">
        <div class="space-y-1.5">
          <div class="flex justify-between text-xs text-slate-400 font-mono">
            <span>TIMELINE</span>
            <span id="frame-counter" class="text-slate-200">0 / 0</span>
          </div>
          <input type="range" id="timeline" min="0" max="0" value="0"
            class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500 touch-pan-x disabled:opacity-50 disabled:cursor-not-allowed">
        </div>

        <div class="grid grid-cols-4 gap-2">
          <button id="btn-prev"
            class="ctrl-btn bg-slate-800/80 hover:bg-slate-700/80 active:bg-slate-600 border border-slate-700/60 text-slate-200 py-2.5 rounded-lg text-xs font-semibold transition touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed">
            ⏮ -1
          </button>
          <button id="btn-play"
            class="ctrl-btn col-span-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-emerald-950/20">
            PLAY
          </button>
          <button id="btn-next"
            class="ctrl-btn bg-slate-800/80 hover:bg-slate-700/80 active:bg-slate-600 border border-slate-700/60 text-slate-200 py-2.5 rounded-lg text-xs font-semibold transition touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed">
            +1 ⏭
          </button>
        </div>

        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-400">SPEED:</span>
          <select id="speed-select"
            class="ctrl-btn flex-1 bg-slate-800/80 border border-slate-700/60 text-slate-200 text-xs rounded-lg px-2.5 py-2 outline-none focus:border-emerald-500 transition disabled:opacity-40 disabled:cursor-not-allowed">
            <option value="1">1x (60 FPS)</option>
            <option value="2" selected>2x (120 FPS)</option>
            <option value="5">5x (300 FPS)</option>
            <option value="10">10x (Fast Forward)</option>
          </select>
        </div>

        <button id="btn-recalc"
          class="w-full border border-emerald-500/30 hover:border-emerald-500/60 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 font-semibold py-2.5 rounded-lg text-xs transition touch-manipulation active:scale-[0.99] disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none">
          RE-SIMULATE (NEW SEED)
        </button>
      </section>

    </aside>
  </main>

  <script>
    const GRID_W = 32;
    const GRID_H = 18;
    const TOTAL_CELLS = GRID_W * GRID_H;
    const CELL_SIZE = 30;
    const MAX_PARTICLES = 1000;

    class Point {
      constructor(x, y) { this.x = x; this.y = y; }
      add(q) { return new Point(this.x + q.x, this.y + q.y); }
      equals(q) { return q && this.x === q.x && this.y === q.y; }
      inBounds() { return this.x >= 0 && this.x < GRID_W && this.y >= 0 && this.y < GRID_H; }
    }

    const DIRS = [
      new Point(0, -1),
      new Point(0, 1),
      new Point(-1, 0),
      new Point(1, 0)
    ];

    class GameSimulator {
      constructor() {
        this.cycle = [];
        this.cycleIdx = new Array(TOTAL_CELLS);
        this.buildHamiltonianCycle();
      }

      buildHamiltonianCycle() {
        this.cycle = [];
        for (let x = 0; x < GRID_W; x++) this.cycle.push(new Point(x, 0));
        for (let y = 1; y < GRID_H - 1; y++) {
          if (y % 2 === 1) {
            for (let x = GRID_W - 1; x >= 1; x--) this.cycle.push(new Point(x, y));
          } else {
            for (let x = 1; x < GRID_W; x++) this.cycle.push(new Point(x, y));
          }
        }
        for (let x = GRID_W - 1; x >= 0; x--) this.cycle.push(new Point(x, GRID_H - 1));
        for (let y = GRID_H - 2; y >= 1; y--) this.cycle.push(new Point(0, y));

        for (let idx = 0; idx < this.cycle.length; idx++) {
          const pt = this.cycle[idx];
          this.cycleIdx[pt.y * GRID_W + pt.x] = idx;
        }
      }

      distanceOnCycle(fromIdx, toIdx) {
        return (toIdx - fromIdx + TOTAL_CELLS) % TOTAL_CELLS;
      }

      isIdxInSnakeBody(idx, tailIdx, headIdx) {
        if (tailIdx <= headIdx) {
          return idx >= tailIdx && idx <= headIdx;
        }
        return idx >= tailIdx || idx <= headIdx;
      }

      canReachTail(snake, food, activeCells, nextHead) {
        const isEating = nextHead.equals(food);
        const tail = snake[snake.length - 1];

        const visited = new Array(TOTAL_CELLS).fill(false);
        const queue = [nextHead];
        visited[nextHead.y * GRID_W + nextHead.x] = true;

        const nextHeadIdx = nextHead.y * GRID_W + nextHead.x;
        const tailIdx = tail.y * GRID_W + tail.x;

        const oldNextHeadActive = activeCells[nextHeadIdx];
        const oldTailActive = activeCells[tailIdx];

        activeCells[nextHeadIdx] = true;
        if (!isEating) activeCells[tailIdx] = false;

        let canReach = false;
        let headPtr = 0;

        while (headPtr < queue.length) {
          const curr = queue[headPtr++];
          if (curr.equals(tail)) {
            canReach = true;
            break;
          }

          for (const d of DIRS) {
            const nxt = curr.add(d);
            if (nxt.inBounds()) {
              const idx = nxt.y * GRID_W + nxt.x;
              if (!activeCells[idx] && !visited[idx]) {
                visited[idx] = true;
                queue.push(nxt);
              }
            }
          }
        }

        activeCells[nextHeadIdx] = oldNextHeadActive;
        activeCells[tailIdx] = oldTailActive;

        return canReach;
      }

      aiStep(snake, food, activeCells, dir) {
        const head = snake[0];
        const headIdx = this.cycleIdx[head.y * GRID_W + head.x];
        const foodIdx = this.cycleIdx[food.y * GRID_W + food.x];
        const tail = snake[snake.length - 1];
        const tailIdx = this.cycleIdx[tail.y * GRID_W + tail.x];
        const opposite = new Point(-dir.x, -dir.y);

        const snakeLen = snake.length;
        const nextOnCycle = this.cycle[(headIdx + 1) % TOTAL_CELLS];
        const defaultDir = new Point(nextOnCycle.x - head.x, nextOnCycle.y - head.y);

        let bestDir = defaultDir;
        let bestDist = this.distanceOnCycle(headIdx, foodIdx);
        let foundShortcut = false;

        for (const d of DIRS) {
          if (d.equals(opposite)) continue;
          const next = head.add(d);
          if (!next.inBounds() || activeCells[next.y * GRID_W + next.x]) continue;

          const nextIdx = this.cycleIdx[next.y * GRID_W + next.x];
          if (this.isIdxInSnakeBody(nextIdx, tailIdx, headIdx)) continue;

          const dist = this.distanceOnCycle(nextIdx, foodIdx);

          if (dist < bestDist) {
            const cycleDistToTail = this.distanceOnCycle(nextIdx, tailIdx);
            if (cycleDistToTail > snakeLen && this.canReachTail(snake, food, activeCells, next)) {
              bestDist = dist;
              bestDir = d;
              foundShortcut = true;
            }
          }
        }

        if (!foundShortcut || bestDir.equals(defaultDir)) {
          return { dir: defaultDir, mode: "HAMILTONIAN" };
        }
        return { dir: bestDir, mode: "SHORTCUT" };
      }

      runSimulation() {
        const history = [];
        const activeCells = new Array(TOTAL_CELLS).fill(false);

        const startIdx = Math.floor(this.cycle.length / 2);
        const snake = [];
        for (let i = 0; i < 3; i++) {
          const idx = (startIdx - i + this.cycle.length) % this.cycle.length;
          const pt = this.cycle[idx];
          snake.push(pt);
          activeCells[pt.y * GRID_W + pt.x] = true;
        }

        const nextP = this.cycle[(startIdx + 1) % this.cycle.length];
        let dir = new Point(nextP.x - snake[0].x, nextP.y - snake[0].y);

        const spawnFood = () => {
          const free = [];
          for (let y = 0; y < GRID_H; y++) {
            for (let x = 0; x < GRID_W; x++) {
              if (!activeCells[y * GRID_W + x]) free.push(new Point(x, y));
            }
          }
          if (free.length === 0) return null;
          return free[Math.floor(Math.random() * free.length)];
        };

        let food = spawnFood();
        let alive = true;

        while (alive && snake.length < TOTAL_CELLS) {
          const decision = this.aiStep(snake, food, activeCells, dir);
          dir = decision.dir;

          const newHead = snake[0].add(dir);
          const eat = newHead.equals(food);

          history.push({
            snake: snake.map(p => new Point(p.x, p.y)),
            food: new Point(food.x, food.y),
            mode: decision.mode,
            dir: new Point(dir.x, dir.y),
            isEating: eat
          });

          snake.unshift(newHead);
          activeCells[newHead.y * GRID_W + newHead.x] = true;

          if (!eat) {
            const tail = snake.pop();
            activeCells[tail.y * GRID_W + tail.x] = false;
          } else {
            food = spawnFood();
            if (!food) break;
          }
        }

        if (snake.length === TOTAL_CELLS) {
          history.push({
            snake: snake.map(p => new Point(p.x, p.y)),
            food: food ? new Point(food.x, food.y) : new Point(-1, -1),
            mode: "FINISHED",
            dir: new Point(0, 0),
            isEating: false
          });
        }

        return history;
      }
    }

    // --- WebGPU Engine with WebGL2 Fallback ---
    class WebGPURenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.adapter = null;
        this.device = null;
        this.context = null;
        this.computePipeline = null;
        this.renderPipeline = null;
        this.particleBuffer = null;
        this.uniformBuffer = null;
        this.bindGroup = null;
        this.isSupported = false;
      }

      async init() {
        if (!navigator.gpu) return false;
        try {
          this.adapter = await navigator.gpu.requestAdapter();
          if (!this.adapter) return false;
          this.device = await this.adapter.requestDevice();
          this.context = this.canvas.getContext('webgpu');
          this.format = navigator.gpu.getPreferredCanvasFormat();
          this.context.configure({ device: this.device, format: this.format });

          this.initShadersAndPipelines();
          this.isSupported = true;
          return true;
        } catch (e) {
          console.warn('WebGPU Init Failed, falling back to WebGL2:', e);
          return false;
        }
      }

      initShadersAndPipelines() {
        const wgslCode = `
          struct Particle {
            pos: vec2<f32>,
            vel: vec2<f32>,
            life: f32,
            maxLife: f32,
          };

          struct SimulationParams {
            dt: f32,
            triggerPos: vec2<f32>,
            triggerEvent: f32,
            padding: f32,
          };

          @group(0) @binding(0) var<storage, read_write> particles: array<Particle, ${MAX_PARTICLES}>;
          @group(0) @binding(1) var<uniform> params: SimulationParams;

          // Simple PRNG for GPU
          fn rand(st: vec2<f32>) -> f32 {
            return fract(sin(dot(st, vec2<f32>(12.9898, 78.233))) * 43758.5453123);
          }

          @compute @workgroup_size(64)
          fn computeMain(@builtin(global_invocation_id) global_id: vec3<u32>) {
            let id = global_id.x;
            if (id >= ${MAX_PARTICLES}u) { return; }

            var p = particles[id];

            // Trigger Burst event
            if (params.triggerEvent > 0.5) {
              let seed = vec2<f32>(f32(id), params.triggerPos.x + params.triggerPos.y);
              let angle = rand(seed) * 6.283185307;
              let speed = 50.0 + rand(seed + vec2<f32>(1.0, 0.0)) * 250.0;
              p.pos = params.triggerPos;
              p.vel = vec2<f32>(cos(angle), sin(angle)) * speed;
              p.life = 1.0;
              p.maxLife = 0.4 + rand(seed + vec2<f32>(0.0, 1.0)) * 0.4;
            } else if (p.life > 0.0) {
              p.life -= params.dt / p.maxLife;
              p.pos += p.vel * params.dt;
              p.vel *= 0.95; // Drag factor
            }

            particles[id] = p;
          }

          struct VertexOutput {
            @builtin(position) position: vec4<f32>,
            @location(0) alpha: f32,
          };

          @vertex
          fn vertMain(@builtin(vertex_index) vertexIdx: u32) -> VertexOutput {
            let particleIdx = vertexIdx / 6u;
            let p = particles[particleIdx];

            var out: VertexOutput;
            if (p.life <= 0.0) {
              out.position = vec4<f32>(2.0, 2.0, 0.0, 1.0); // Offscreen
              out.alpha = 0.0;
              return out;
            }

            let quadOffset = array<vec2<f32>, 6>(
              vec2<f32>(-3.0, -3.0), vec2<f32>( 3.0, -3.0), vec2<f32>(-3.0,  3.0),
              vec2<f32>(-3.0,  3.0), vec2<f32>( 3.0, -3.0), vec2<f32>( 3.0,  3.0)
            );

            let offset = quadOffset[vertexIdx % 6u];
            let screenPos = p.pos + offset;
            let clipPos = vec2<f32>((screenPos.x / 960.0) * 2.0 - 1.0, 1.0 - (screenPos.y / 540.0) * 2.0);

            out.position = vec4<f32>(clipPos, 0.0, 1.0);
            out.alpha = max(0.0, p.life);
            return out;
          }

          @fragment
          fn fragMain(in: VertexOutput) -> @location(0) vec4<f32> {
            return vec4<f32>(0.95, 0.25, 0.35, in.alpha);
          }
        `;

        const shaderModule = this.device.createShaderModule({ code: wgslCode });

        // Storage & Uniform Buffers
        this.particleBuffer = this.device.createBuffer({
          size: MAX_PARTICLES * 32, // 8 floats per particle
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
        });

        this.uniformBuffer = this.device.createBuffer({
          size: 32,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });

        const bindGroupLayout = this.device.createBindGroupLayout({
          entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX, buffer: { type: 'storage' } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } }
          ]
        });

        this.bindGroup = this.device.createBindGroup({
          layout: bindGroupLayout,
          entries: [
            { binding: 0, resource: { buffer: this.particleBuffer } },
            { binding: 1, resource: { buffer: this.uniformBuffer } }
          ]
        });

        const pipelineLayout = this.device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] });

        this.computePipeline = this.device.createComputePipeline({
          layout: pipelineLayout,
          compute: { module: shaderModule, entryPoint: 'computeMain' }
        });

        this.renderPipeline = this.device.createRenderPipeline({
          layout: pipelineLayout,
          vertex: { module: shaderModule, entryPoint: 'vertMain' },
          fragment: {
            module: shaderModule,
            entryPoint: 'fragMain',
            targets: [{
              format: this.format,
              blend: {
                color: { srcFactor: 'src-alpha', dstFactor: 'one', operation: 'add' },
                alpha: { srcFactor: 'zero', dstFactor: 'one', operation: 'add' }
              }
            }]
          },
          primitive: { topology: 'triangle-list' }
        });
      }

      dispatchBurst(x, y) {
        const params = new Float32Array([0.016, x, y, 1.0, 0, 0, 0, 0]);
        this.device.queue.writeBuffer(this.uniformBuffer, 0, params);
      }

      renderParticles(dt, triggerBurst, burstX, burstY) {
        const params = new Float32Array([dt, burstX, burstY, triggerBurst ? 1.0 : 0.0, 0, 0, 0, 0]);
        this.device.queue.writeBuffer(this.uniformBuffer, 0, params);

        const commandEncoder = this.device.createCommandEncoder();

        // Compute Pass
        const computePass = commandEncoder.beginComputePass();
        computePass.setPipeline(this.computePipeline);
        computePass.setBindGroup(0, this.bindGroup);
        computePass.dispatchWorkgroups(Math.ceil(MAX_PARTICLES / 64));
        computePass.end();

        // Render Pass
        const textureView = this.context.getCurrentTexture().createView();
        const renderPass = commandEncoder.beginRenderPass({
          colorAttachments: [{
            view: textureView,
            clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 0.0 }, // Transparent overlay on 2d Canvas
            loadOp: 'clear',
            storeOp: 'store'
          }]
        });
        renderPass.setPipeline(this.renderPipeline);
        renderPass.setBindGroup(0, this.bindGroup);
        renderPass.draw(MAX_PARTICLES * 6);
        renderPass.end();

        this.device.queue.submit([commandEncoder.finish()]);
      }
    }

    // --- WebGL2 Fallback Engine ---
    class WebGL2ParticleRenderer {
      constructor(canvas) {
        this.canvas = canvas;
        this.gl = canvas.getContext('webgl2');
        this.particles = [];
        this.isSupported = !!this.gl;
      }

      dispatchBurst(x, y) {
        for (let i = 0; i < 150; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 50 + Math.random() * 250;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            maxLife: 0.4 + Math.random() * 0.4
          });
        }
      }

      renderParticles(dt) {
        if (!this.isSupported) return;
        // Simple CPU fallback simulation drawn to 2D context or overlay
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life -= dt / p.maxLife;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.95;
          p.vy *= 0.95;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
      }

      drawFallback2D(ctx) {
        ctx.save();
        this.particles.forEach(p => {
          ctx.fillStyle = `rgba(244, 63, 94, ${Math.max(0, p.life)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    }

    // --- Simulation Controller & Canvas Pipeline ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const simulator = new GameSimulator();
    let webgpuEngine = new WebGPURenderer(canvas);
    let webglFallback = new WebGL2ParticleRenderer(canvas);
    let activeEngineType = 'CANVAS2D';

    let history = [];
    let currentFrame = 0;
    let isPlaying = false;
    let isGenerating = false;
    let animationFrameId = null;
    let lastRenderTime = 0;

    const elTimeline = document.getElementById('timeline');
    const elFrameCounter = document.getElementById('frame-counter');
    const elMLen = document.getElementById('m-len');
    const elMProg = document.getElementById('m-prog');
    const elMMode = document.getElementById('m-mode');
    const elMSteps = document.getElementById('m-steps');
    const elPShortcut = document.getElementById('p-shortcut');
    const elPHamiltonian = document.getElementById('p-hamiltonian');
    const elBarShortcut = document.getElementById('bar-shortcut');
    const elBarHamiltonian = document.getElementById('bar-hamiltonian');
    const elBtnPlay = document.getElementById('btn-play');
    const elBtnRecalc = document.getElementById('btn-recalc');
    const elBtnPrev = document.getElementById('btn-prev');
    const elBtnNext = document.getElementById('btn-next');
    const elSpeedSelect = document.getElementById('speed-select');
    const elLoading = document.getElementById('loading-overlay');
    const elStatusTag = document.getElementById('status-tag');
    const elStatusIndicator = document.getElementById('status-indicator');
    const elEngineTag = document.getElementById('engine-tag');

    const waitForNextPaint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    async function initEngine() {
      const gpuSuccess = await webgpuEngine.init();
      if (gpuSuccess) {
        activeEngineType = 'WEBGPU';
        elEngineTag.textContent = 'WEBGPU';
        elEngineTag.className = 'text-emerald-400 font-semibold';
      } else {
        webglFallback = new WebGL2ParticleRenderer(canvas);
        if (webglFallback.isSupported) {
          activeEngineType = 'WEBGL2';
          elEngineTag.textContent = 'WEBGL2';
          elEngineTag.className = 'text-cyan-400 font-semibold';
        } else {
          activeEngineType = 'CANVAS2D';
          elEngineTag.textContent = 'CANVAS 2D';
          elEngineTag.className = 'text-amber-400 font-semibold';
        }
      }
    }

    function setGeneratingState(generating) {
      isGenerating = generating;
      const elementsToLock = [elBtnRecalc, elBtnPlay, elBtnPrev, elBtnNext, elTimeline, elSpeedSelect];
      elementsToLock.forEach(el => el.disabled = generating);

      if (generating) {
        if (isPlaying) stopPlayback();
        elLoading.classList.remove('opacity-0', 'pointer-events-none');
        elStatusTag.textContent = "CALCULATING";
        elStatusTag.className = "text-amber-400 font-semibold tracking-wide";
        elStatusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
      } else {
        elLoading.classList.add('opacity-0', 'pointer-events-none');
        elStatusTag.textContent = "READY";
        elStatusTag.className = "text-emerald-400 font-semibold tracking-wide";
        elStatusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
      }
    }

    async function startSimulation() {
      if (isGenerating) return;
      setGeneratingState(true);
      await waitForNextPaint();

      try {
        history = simulator.runSimulation();

        let shortcuts = 0, hams = 0;
        for (let i = 0; i < history.length; i++) {
          if (history[i].mode === "SHORTCUT") shortcuts++;
          else if (history[i].mode === "HAMILTONIAN") hams++;
        }
        const total = shortcuts + hams || 1;
        const pShort = (shortcuts / total * 100).toFixed(1);
        const pHam = (hams / total * 100).toFixed(1);

        elPShortcut.textContent = `${pShort}%`;
        elPHamiltonian.textContent = `${pHam}%`;
        elBarShortcut.style.width = `${pShort}%`;
        elBarHamiltonian.style.width = `${pHam}%`;

        elTimeline.max = history.length - 1;
        elTimeline.value = 0;
        currentFrame = 0;

        renderFrame(0, false);
      } finally {
        setGeneratingState(false);
      }
    }

    function renderFrame(idx, triggerBurst = false) {
      if (!history || history.length === 0) return;
      const frame = history[idx];

      // Draw Base Game Frame (Canvas 2D)
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= GRID_W; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL_SIZE, 0);
        ctx.lineTo(x * CELL_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= GRID_H; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL_SIZE);
        ctx.lineTo(canvas.width, y * CELL_SIZE);
        ctx.stroke();
      }

      // Draw Food
      if (frame.food.x >= 0) {
        const fx = frame.food.x * CELL_SIZE + CELL_SIZE / 2;
        const fy = frame.food.y * CELL_SIZE + CELL_SIZE / 2;
        const pulse = Math.sin(Date.now() / 200) * 1.5;

        ctx.shadowColor = 'rgba(244, 63, 94, 0.8)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(fx, fy, Math.max(3, CELL_SIZE / 2 - 5 + pulse), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Draw Snake
      const len = frame.snake.length;
      frame.snake.forEach((pt, i) => {
        const px = pt.x * CELL_SIZE + 1.5;
        const py = pt.y * CELL_SIZE + 1.5;
        const size = CELL_SIZE - 3;
        const radius = i === 0 ? 6 : 3;

        if (i === 0) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = 'rgba(52, 211, 153, 0.5)';
          ctx.shadowBlur = 8;
        } else {
          const alpha = Math.max(0.2, 1 - (i / len) * 0.75);
          ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.roundRect(px, py, size, size, radius);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (i === 0) {
          ctx.fillStyle = '#020617';
          const dir = frame.dir;
          let eye1 = { x: px + 8, y: py + 8 };
          let eye2 = { x: px + size - 8, y: py + 8 };

          if (dir.x === 1) {
            eye1 = { x: px + size - 8, y: py + 8 };
            eye2 = { x: px + size - 8, y: py + size - 8 };
          } else if (dir.x === -1) {
            eye1 = { x: px + 8, y: py + 8 };
            eye2 = { x: px + 8, y: py + size - 8 };
          } else if (dir.y === 1) {
            eye1 = { x: px + 8, y: py + size - 8 };
            eye2 = { x: px + size - 8, y: py + size - 8 };
          }

          ctx.beginPath();
          ctx.arc(eye1.x, eye1.y, 2, 0, Math.PI * 2);
          ctx.arc(eye2.x, eye2.y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Handle Food Eat Particles Trigger (Only when playing)
      const burstPos = {
        x: frame.food.x * CELL_SIZE + CELL_SIZE / 2,
        y: frame.food.y * CELL_SIZE + CELL_SIZE / 2
      };

      if (activeEngineType === 'WEBGPU') {
        webgpuEngine.renderParticles(0.016, triggerBurst && frame.isEating, burstPos.x, burstPos.y);
      } else if (activeEngineType === 'WEBGL2') {
        if (triggerBurst && frame.isEating) webglFallback.dispatchBurst(burstPos.x, burstPos.y);
        webglFallback.renderParticles(0.016);
        webglFallback.drawFallback2D(ctx);
      }

      elFrameCounter.textContent = `${idx} / ${history.length - 1}`;
      elMLen.textContent = `${len} / ${TOTAL_CELLS}`;
      elMProg.textContent = `${(len / TOTAL_CELLS * 100).toFixed(1)}%`;
      elMMode.textContent = frame.mode;
      elMSteps.textContent = idx;
    }

    function animLoop(timestamp) {
      if (!isPlaying) return;

      const speed = parseInt(elSpeedSelect.value, 10);
      const targetFPS = 60 * speed;
      const frameInterval = 1000 / targetFPS;

      if (!lastRenderTime) lastRenderTime = timestamp;
      const delta = timestamp - lastRenderTime;

      if (delta >= frameInterval) {
        lastRenderTime = timestamp - (delta % frameInterval);

        if (currentFrame < history.length - 1) {
          currentFrame++;
          elTimeline.value = currentFrame;
          renderFrame(currentFrame, true); // Pass true to enable particle trigger
        } else {
          stopPlayback();
          return;
        }
      }

      animationFrameId = requestAnimationFrame(animLoop);
    }

    function startPlayback() {
      if (currentFrame >= history.length - 1) currentFrame = 0;
      isPlaying = true;
      lastRenderTime = 0;
      elBtnPlay.textContent = "PAUSE";
      elBtnPlay.className = "ctrl-btn col-span-2 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-amber-950/20";
      animationFrameId = requestAnimationFrame(animLoop);
    }

    function stopPlayback() {
      isPlaying = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      elBtnPlay.textContent = "PLAY";
      elBtnPlay.className = "ctrl-btn col-span-2 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition touch-manipulation disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-emerald-950/20";
    }

    function togglePlay() {
      if (isGenerating) return;
      isPlaying ? stopPlayback() : startPlayback();
    }

    // Event Listeners (Drag Timeline ignores particle bursts)
    elTimeline.addEventListener('input', (e) => {
      if (isGenerating) return;
      currentFrame = parseInt(e.target.value, 10);
      renderFrame(currentFrame, false); // Dragging timeline won't trigger particle burst
    });

    elBtnPrev.addEventListener('click', () => {
      if (isGenerating || currentFrame <= 0) return;
      if (isPlaying) stopPlayback();
      currentFrame--;
      elTimeline.value = currentFrame;
      renderFrame(currentFrame, false);
    });

    elBtnNext.addEventListener('click', () => {
      if (isGenerating || currentFrame >= history.length - 1) return;
      if (isPlaying) stopPlayback();
      currentFrame++;
      elTimeline.value = currentFrame;
      renderFrame(currentFrame, false);
    });

    elBtnPlay.addEventListener('click', togglePlay);
    elBtnRecalc.addEventListener('click', startSimulation);

    // Initial Engine Bootstrap
    (async () => {
      await initEngine();
      await startSimulation();
    })();
  </script>
</body>

</html>
